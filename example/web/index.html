<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <meta name="theme-color" content="#0B0C14">
  <meta name="description" content="Interactive 2D rigid-body physics demos — matter_dart / Matter.js port for Flutter Web.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matter Dart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Matter Dart — physics demos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0B0C14;
      color: #E5E7EB;
      font-family: 'DM Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0B0C14;
      z-index: 9999;
      transition: opacity 280ms ease-out;
    }
    #loading.fade {
      opacity: 0;
      pointer-events: none;
    }
    #loading .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #1F2937;
      border-top-color: #60A5FA;
      animation: matter-spin 800ms linear infinite;
    }
    #loading .brand {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #E5E7EB;
    }
    #loading .label {
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #6B7280;
      text-transform: uppercase;
    }
    @keyframes matter-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Loading Matter Dart">
    <div class="spinner"></div>
    <div class="brand">Matter Dart</div>
    <div class="label">Loading physics engine…</div>
  </div>

  <script>
    (function () {
      function hideLoading() {
        var el = document.getElementById('loading');
        if (!el || el.classList.contains('fade')) return;
        el.classList.add('fade');
        setTimeout(function () { el.remove(); }, 320);
      }

      var observer = new MutationObserver(function () {
        if (
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flutter-view') ||
          document.querySelector('flt-scene-host')
        ) {
          hideLoading();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(hideLoading, 15000);
    })();
  </script>

  <script>
    {{flutter_bootstrap_js}}
  </script>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
